[package]
name = "rod"
version = "0.2.3"
edition = "2024"
repository = "https://github.com/mmalmi/rod"
description = "Distributed graph database that syncs over websockets and multicast"
license = "MIT"
rust-version = "1.85"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redb = "4.1"
serde = { version =  "1.0", features = ["derive"] }
serde_json = "1.0.64"
bincode = "1.3.3"
rand = "^0.8"
clap = "2.33.3"
pretty_env_logger = "0.4.0"
futures-util = "0.3.21"
tokio = { version = "1.17.0", features = ["full"] }
tokio-stream = "0.1.8"
async-trait = "0.1.51"
env_logger = "0.9.0"
log = "0.4.14"
tokio-tungstenite = { version = "0.17.1", features=["native-tls"]}
warp = { version = "0.3.2", features=["tls"] }
url = "2.2.2"
multicast-socket = "0.2.2"
sysinfo = "0.23.5"
bytes = "1.1.0"
tokio-native-tls = "0.3.0"
size_format = "1.0.2"
ctrlc = "3.2.1"
tokio-test = "0.4.2"
zeroize = "1.7"
dirs = "5.0"
parking_lot = "0.12"
java-utils = "0.1.0"
ring = "0.16.20"
jsonwebtoken = "8.1.0"
jsonwebkey = { version = "0.3.5", features=["jwt-convert"] }
base64 = "0.13.0"
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.3", features=["async_futures", "html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false

[[bin]]
name = "beam-sea-keygen"
path = "src/bin/beam-sea-keygen.rs"
