name: Gitea CI
# Gitea-native CI. Runner labels: self-hosted,linux,docker.
# Clones over the internal gitea:3000 hostname (no LAN IP in this file).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  check-test:
    runs-on: self-hosted
    container:
      image: rust:latest
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 "http://guan:${{ github.token }}@gitea:3000/guan/beamdb.git" .repo
      - name: cargo check
        working-directory: .repo
        run: cargo check --all-targets --all-features
      - name: cargo test (lib + doc)
        working-directory: .repo
        run: cargo test --workspace --lib && cargo test --workspace --doc
